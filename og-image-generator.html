<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'VT323', monospace;
            background: #000000;
            color: #00FF00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #preview-card {
            width: 1200px;
            height: 630px;
            background: #000000;
            border: 4px solid #00FF00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        #preview-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                transparent 50%,
                rgba(0, 255, 0, 0.03) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
        
        .title {
            font-size: 72px;
            color: #00FF00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            letter-spacing: 8px;
            margin-bottom: 40px;
            font-weight: normal;
        }
        
        .description {
            font-size: 36px;
            color: #33FF33;
            text-shadow: 0 0 10px rgba(51, 255, 51, 0.6);
            letter-spacing: 3px;
            line-height: 1.5;
        }
        
        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 255, 0, 0.1) 0%,
                transparent 70%
            );
            pointer-events: none;
            animation: glow-pulse 3s ease-in-out infinite;
        }
        
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }
        
        #download-button {
            margin-top: 30px;
            padding: 15px 30px;
            background: transparent;
            border: 2px solid #00FF00;
            color: #00FF00;
            font-family: 'VT323', monospace;
            font-size: 24px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        #download-button:hover {
            background: #00FF00;
            color: #000000;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
        }
    </style>
</head>
<body>
    <div id="preview-card">
        <div class="glow-effect"></div>
        <div class="title">AIRBROS 2025 LEADERBOARD</div>
        <div class="description">Just a couple friends tracking their flights.</div>
    </div>
    
    <button id="download-button" onclick="downloadImage()">Download Image</button>
    
    <script>
        function downloadImage() {
            const card = document.getElementById('preview-card');
            const button = document.getElementById('download-button');
            button.style.display = 'none';
            
            html2canvas(card, {
                backgroundColor: '#000000',
                scale: 1,
                width: 1200,
                height: 630,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'og-image.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                button.style.display = 'block';
            });
        }
    </script>
</body>
</html>
